name: Publish to Comfy registry

# 触发条件：
# 1) 手动触发（Actions 页面 Run workflow）
# 2) 推送到 main 且 pyproject.toml 有变更（发布版本需要同时更新
#    pyproject.toml 与 __init__.py 的 __version__，CI 会校验两者一致）
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

# 最小权限：checkout 与发布只需要读取仓库内容
permissions:
  contents: read

# 发布串行化：同一工作流/分支不并发，避免两次发布同时通过版本守卫。
# cancel-in-progress=false：已开始的发布（或校验）不被打断。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 仅维护者仓库的 main 分支发布；tag / 其他分支一律跳过。
    if: ${{ github.repository_owner == 'StarAsh042' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify version consistency
        run: |
          python - <<'PY'
          import pathlib
          import re
          import tomllib

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text("utf-8")
          )["project"]["version"]
          source = pathlib.Path("__init__.py").read_text("utf-8")
          match = re.search(r'__version__ = "([^"]+)"', source)
          assert match and match.group(1) == version, (
              match.group(1) if match else None,
              version,
          )
          print("version:", version)
          PY
      - name: Assert version changed since last publish
        # 只读 Registry 基线：不读 secret、不写仓库、不以 tag 为基线。
        # 以 GITHUB_REPOSITORY 末段作为 node id，先严格校验节点存在（禁止自动
        # 跟随重定向），确认 200 后才读取已发布版本；整数三元组比较，任何失败
        # 都以 RIG-A 令牌 + 非零退出阻断发布。
        run: |
          python - "${GITHUB_REPOSITORY#*/}" <<'PY'
          # -*- coding: utf-8 -*-
          import json
          import pathlib
          import re
          import sys
          import tomllib
          import urllib.error
          import urllib.request

          TOKEN = "RIG-A"
          SEMVER = re.compile(r"^\d+\.\d+\.\d+$")
          HEADERS = {
              "Accept": "application/json",
              "User-Agent": "ComfyUI-model-toolkit-release-guard",
          }


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              # 3xx 一律不跟随：redirect_request 返回 None，urlopen 抛 HTTPError
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def emit(code, message, exit_code):
              print(f"{TOKEN} {code} {message}")
              sys.exit(exit_code)


          def triple(version):
              return tuple(int(part) for part in version.split("."))


          def fetch(url):
              # 严格只读 GET：网络/超时错误直接阻断，非 200（含 3xx）交给调用方判定
              request = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, b""
              except Exception as error:
                  emit("REGISTRY_UNREACHABLE", f"{type(error).__name__}: {error}", 1)


          def read_json(status, body, what):
              if status != 200:
                  emit("REGISTRY_UNREACHABLE", f"{what} HTTP {status}", 1)
              try:
                  return json.loads(body.decode("utf-8"))
              except Exception as error:
                  emit("REGISTRY_UNREACHABLE", f"{what} invalid JSON: {error}", 1)


          def main():
              current = tomllib.loads(
                  pathlib.Path("pyproject.toml").read_text("utf-8")
              )["project"]["version"]
              if not SEMVER.match(current):
                  emit("VERSION_NOT_SEMVER", f"current={current!r}", 1)

              # node id 取 GITHUB_REPOSITORY 末段（由 shell 展开，不硬编码）
              node_id = sys.argv[1].strip() if len(sys.argv) > 1 else ""
              if not node_id:
                  emit("REGISTRY_UNREACHABLE", "GITHUB_REPOSITORY is empty", 1)

              # 禁止自动重定向：小写 node id 会 302 到规范大小写，跟随会掩盖拼写问题
              urllib.request.install_opener(
                  urllib.request.build_opener(_NoRedirect)
              )

              # 1) 存在性校验：/versions 对未知节点返回 200 + []，不能单独作为基线
              status, body = fetch(f"https://api.comfy.org/nodes/{node_id}")
              if status == 404:
                  emit("BASELINE_UNKNOWN_NODE", f"{node_id} not found", 1)
              read_json(status, body, "node metadata")

              # 2) 节点元数据确认存在后才读取已发布版本
              status, body = fetch(f"https://api.comfy.org/nodes/{node_id}/versions")
              payload = read_json(status, body, "node versions")

              entries = payload.get("versions") if isinstance(payload, dict) else payload
              if not isinstance(entries, list):
                  emit("REGISTRY_UNREACHABLE", "unexpected versions payload", 1)

              published = [
                  entry["version"]
                  for entry in entries
                  if isinstance(entry, dict) and isinstance(entry.get("version"), str)
              ]
              if not entries:
                  emit("NO_BASELINE_FIRST_PUBLISH", f"{node_id} has no published versions", 0)
              if not published:
                  emit("REGISTRY_UNREACHABLE", "no readable version fields", 1)

              if current in published:
                  emit("VERSION_UNCHANGED", f"{current} already published", 1)

              parsed = []
              for version in published:
                  if not SEMVER.match(version):
                      emit("VERSION_NOT_SEMVER", f"published={version!r}", 1)
                  parsed.append(triple(version))

              latest = max(parsed)
              current_triple = triple(current)
              if current_triple < latest:
                  emit(
                      "VERSION_BELOW_PUBLISHED",
                      f"{current} < {'.'.join(str(part) for part in latest)}",
                      1,
                  )
              emit(
                  "VERSION_AHEAD",
                  f"{current} > {'.'.join(str(part) for part in latest)}",
                  0,
              )


          if __name__ == "__main__":
              main()
          PY
      - name: Publish Custom Node
        # 官方文档推荐 @main（该 action 的 tag 只有 1.0.0/1.0.1，已落后于 main）
        uses: Comfy-Org/publish-node-action@main
        with:
          ## 在仓库 Settings -> Secrets and variables -> Actions 中配置该 Secret
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          ## 上一步已完成 checkout，跳过该 action 内部重复的 actions/checkout
          skip_checkout: "true"
